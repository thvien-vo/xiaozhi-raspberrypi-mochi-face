# Workflow name (customizable)
name: Deploy GitHub Pages

# Trigger condition: automatically run this workflow when code is pushed to the main branch
on:
  push:
    branches:
      - main

# Jobs
jobs:
  build-and-deploy:
    # Runner environment: latest Ubuntu (customizable)
    runs-on: ubuntu-latest
    steps:
      # Checkout repository code
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      # Set up Node.js version
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Install yarn
      - name: Install yarn
        run: npm i yarn -g

      # Install dependencies if cache misses
      - name: Install dependencies
        run: cd documents && yarn install

      # Build static documentation files
      - name: Build
        run: cd documents && yarn docs:build

      # Deploy to GitHub Pages
      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v2
        env:
         GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }} # ACCESS_TOKEN is the secret name; replace with your own secret name if different
        with:
          target-branch: gh-pages # Deploy to the gh-pages branch; main holds source code while gh-pages stores generated static files
          build_dir: documents/docs/.vitepress/dist # Output directory for VitePress static files
