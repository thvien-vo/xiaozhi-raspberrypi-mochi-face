name: Build & Upload Release Assets

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            artifact: "installer/*.dmg"
            mac_arch: arm64
          # Build Intel package via Rosetta on arm runner to avoid macos-13 queue delays
          - os: macos-latest
            platform: macos-x64
            artifact: "installer/*.dmg"
            mac_arch: x64
          - os: windows-latest
            platform: windows-x64
            artifact: "installer/*.exe"
            mac_arch: ""
          - os: ubuntu-24.04
            platform: linux-x64
            artifact: "installer/*.deb"
            mac_arch: ""
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            artifact: "installer/*.deb"
            mac_arch: ""

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macOS x64: Rosetta + self-contained x86_64 Python
      # Do not use actions/setup-python darwin-x64 (depends on Intel Homebrew at /usr/local/opt/gettext)
      - name: Install Rosetta (macOS x64 cross-build)
        if: runner.os == 'macOS' && matrix.mac_arch == 'x64'
        run: |
          if /usr/bin/pgrep -q oahd; then
            echo "Rosetta already installed"
          else
            softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Install standalone x86_64 Python (macOS x64)
        if: runner.os == 'macOS' && matrix.mac_arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          # python-build-standalone: bundles its own libs, no Intel Homebrew dependency
          # Can be upgraded alongside upstream when version and tag align; verify architecture after install using file/platform
          RELEASE_TAG="20260718"
          PY_VER="3.10.20"
          ASSET="cpython-${PY_VER}+${RELEASE_TAG}-x86_64-apple-darwin-install_only.tar.gz"
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/${RELEASE_TAG}/${ASSET}"
          DEST="${RUNNER_TEMP}/python-x86_64"
          mkdir -p "$DEST"
          echo "Downloading $URL"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/py-x64.tgz" "$URL"
          tar -xzf "$RUNNER_TEMP/py-x64.tgz" -C "$DEST"
          # install_only extracts into a python/ directory
          if [ -x "$DEST/python/bin/python3" ]; then
            PY="$DEST/python/bin/python3"
          elif [ -x "$DEST/bin/python3" ]; then
            PY="$DEST/bin/python3"
          else
            echo "::error::python3 not found after extract"; find "$DEST" -maxdepth 3 -type f -name 'python*' | head
            exit 1
          fi
          echo "PY_X64=$PY" >> "$GITHUB_ENV"
          echo "$DEST/python/bin" >> "$GITHUB_PATH"
          echo "$DEST/bin" >> "$GITHUB_PATH"
          file "$PY"
          # Run x86_64 interpreter under Rosetta
          arch -x86_64 "$PY" -c "import platform; print(platform.machine(), platform.platform(), platform.python_version())"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # arm64 build requires system portaudio/opus; x64 uses wheels + in-repo libs to avoid arm Homebrew cross-linking
      - name: Install system dependencies (macOS arm64)
        if: runner.os == 'macOS' && matrix.mac_arch == 'arm64'
        run: brew install portaudio opus

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev libportaudio2 \
            libopus0 libopus-dev \
            libasound-dev \
            libxcb-xinerama0 libxkbcommon-x11-0 libegl1 \
            build-essential python3-dev \
            libopenblas-dev liblapack-dev gfortran \
            libatlas-base-dev libssl-dev \
            patchelf autoconf automake libtool cmake \
            dpkg-dev fakeroot \
            meson ninja-build

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: choco install innosetup -y --no-progress

      - name: Add Inno Setup to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/Program Files (x86)/Inno Setup 6" >> $GITHUB_PATH

      - name: Install Python dependencies
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.mac_arch }}" = "x64" ]; then
            echo "Using x86_64 Python: $PY_X64"
            file "$PY_X64"
            arch -x86_64 "$PY_X64" -c "import platform; print(platform.machine(), platform.platform())"
            # uv uses this interpreter to resolve and install x86_64 wheels
            uv sync --python "$PY_X64" --extra gui --group dev
          else
            uv sync --extra gui --group dev
          fi

      - name: Install unifypy
        shell: bash
        run: |
          # Same project venv as uv sync (x64 job venv is already based on x86_64 Python)
          # pyinstaller must be discoverable in PATH (unifypy environment_check looks for the executable)
          uv pip install --upgrade unifypy pyinstaller

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: where.exe ISCC.exe && echo "Inno Setup found"

      # Inject portable ffmpeg/ffprobe (forbid dynamically linked copies from brew/apt/choco)
      # libs/ffmpeg/ is gitignored and only injected in CI or before local packaging
      - name: Bundle portable FFmpeg into libs/
        shell: bash
        run: |
          chmod +x scripts/bundle_ffmpeg.sh
          if [ "$RUNNER_OS" = "macOS" ]; then
            # macOS has no official multi-arch static CDN; extract from static-ffmpeg, forbidding Homebrew
            # Install into project venv (x64 job venv is already x86_64)
            uv pip install static-ffmpeg
            if [ "${{ matrix.mac_arch }}" = "x64" ]; then
              # PYTHON points to venv so static_ffmpeg is importable; arch -x86_64 sets platform.machine=x86_64
              VENV_PY="${PWD}/.venv/bin/python"
              file "$VENV_PY" || true
              arch -x86_64 env PYTHON="$VENV_PY" ./scripts/bundle_ffmpeg.sh mac x64
              file libs/ffmpeg/mac/x64/ffmpeg libs/ffmpeg/mac/x64/ffprobe
              if ! file libs/ffmpeg/mac/x64/ffmpeg | grep -Eq 'x86_64|i386'; then
                echo "::error::ffmpeg is not x86_64: $(file libs/ffmpeg/mac/x64/ffmpeg)"
                exit 1
              fi
            else
              ./scripts/bundle_ffmpeg.sh mac arm64
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            ./scripts/bundle_ffmpeg.sh win x64
          else
            if [ "$(uname -m)" = "aarch64" ]; then
              ./scripts/bundle_ffmpeg.sh linux arm64
            else
              ./scripts/bundle_ffmpeg.sh linux x64
            fi
          fi

      - name: Configure macOS target architecture for unifypy
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # unifypy passes through pyinstaller.target_architecture
          TARGET="arm64"
          if [ "${{ matrix.mac_arch }}" = "x64" ]; then
            TARGET="x86_64"
          fi
          # Any available Python can be used to update the JSON
          if [ -n "${PY_X64:-}" ] && [ -x "${PY_X64:-}" ]; then
            PY="$PY_X64"
          else
            PY="$(command -v python3 || command -v python)"
          fi
          "$PY" - <<PY
          import json
          from pathlib import Path
          path = Path("build.json")
          cfg = json.loads(path.read_text(encoding="utf-8"))
          cfg.setdefault("pyinstaller", {})["target_architecture"] = "${TARGET}"
          path.write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"pyinstaller.target_architecture = {cfg['pyinstaller']['target_architecture']}")
          PY

      - name: Build package
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          rm -f *.spec
          # unifypy>=2.0.18: --version only prints tool version and exits; use --app-version for application version
          #
          # Do not run arch -x86_64 uv (the uv binary itself is arm64 -> Bad CPU type).
          # macOS x64: prepend .venv/bin to PATH so unifypy finds x86_64 pyinstaller;
          # run x86_64 python -m unifypy from venv so the kernel automatically routes through Rosetta.
          export PATH="${PWD}/.venv/bin:${PATH}"
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.mac_arch }}" = "x64" ]; then
            VENV_PY="${PWD}/.venv/bin/python"
            file "$VENV_PY"
            command -v pyinstaller
            pyinstaller --version || true
            "$VENV_PY" -c "import PyInstaller, platform; print(PyInstaller.__version__, platform.machine())"
            "$VENV_PY" -m unifypy . \
              --config build.json \
              --app-version ${{ steps.version.outputs.version }} \
              --verbose \
              --clean
          else
            uv run --no-sync unifypy . \
              --config build.json \
              --app-version ${{ steps.version.outputs.version }} \
              --verbose \
              --clean
          fi

      - name: Verify macOS binary architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Locate main executable inside .app and verify architecture matches matrix
          app="$(find dist -name '*.app' -type d | head -1 || true)"
          if [ -z "$app" ]; then
            echo "::warning::.app not found, skipping architecture check (still relying on installer artifact check)"
            exit 0
          fi
          bin="$app/Contents/MacOS/$(basename "$app" .app)"
          if [ ! -f "$bin" ]; then
            bin="$(find "$app/Contents/MacOS" -type f -perm -111 | head -1)"
          fi
          echo "Binary: $bin"
          file "$bin"
          lipo -info "$bin" || true
          EXPECT="arm64"
          if [ "${{ matrix.mac_arch }}" = "x64" ]; then
            EXPECT="x86_64"
          fi
          if ! lipo -info "$bin" 2>/dev/null | grep -q "$EXPECT"; then
            if ! file "$bin" | grep -q "$EXPECT"; then
              echo "::error::Expected architecture $EXPECT, actual: $(file "$bin")"
              exit 1
            fi
          fi
          echo "Architecture OK: $EXPECT"

      - name: Rename artifact with platform suffix
        shell: bash
        run: |
          mkdir -p dist/release
          shopt -s nullglob
          files=(${{ matrix.artifact }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Installer artifact not found: ${{ matrix.artifact }} (unifypy may have exited 0 without producing output)"
            ls -la installer 2>/dev/null || true
            exit 1
          fi
          for f in "${files[@]}"; do
            ext="${f##*.}"
            base="${f%.*}"
            name="$(basename "$base")"
            cp "$f" "dist/release/${name}-${{ matrix.platform }}.${ext}"
          done
          ls -lh dist/release

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
